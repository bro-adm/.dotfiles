console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[palette]
  grey = '#6c6c6c'

[secondary_prompt]
  template = '❯❯ '
  foreground = 'magenta'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ' '
    template = '{{ if .Env.POSH_VI_MODE }}{{ .Env.POSH_VI_MODE }} {{ end }}'
    foreground = 'p:grey'
    background = 'transparent'
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if contains "N" .Env.POSH_VI_MODE}}p:grey{{end}}', '{{if contains "I" .Env.POSH_VI_MODE}}cyan{{end}}', '{{if contains "V" .Env.POSH_VI_MODE}}white{{end}}', '{{if contains "V-L" .Env.POSH_VI_MODE}}white{{end}}', '{{if contains "R" .Env.POSH_VI_MODE}}yellow{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = '{{ .Path }}'
    foreground = 'blue'
    background = 'transparent'
    type = 'path'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'full'

  [[blocks.segments]]
    template = ' {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <cyan>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>'
    foreground = 'p:grey'
    background = 'transparent'
    type = 'git'
    style = 'plain'

    [blocks.segments.properties]
      branch_icon = ''
      cache_duration = 'none'
      commit_icon = '@'
      fetch_status = true

  [[blocks.segments]]
    template = '{{ if eq .Env.SHOW_KUBE_PROMPT "true" }} ⎈ {{.Context}}{{if .Namespace}}::{{.Namespace}}{{end}}{{ end }}'
    foreground = 'cyan'
    background = 'transparent'
    type = 'kubectl'
    style = 'plain'
    foreground_templates = ['{{if or (contains "prod" .Context) (contains "production" .Context)}}red{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      parse_kubeconfig = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = "command"
    style = "plain"
    foreground = "#ffffff"
    background = 'transparent'

    [blocks.segments.properties]
      shell = "zsh"
      command = "omp-nix-dev-envs-parser"


[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '❯'
    background = 'transparent'
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}red{{end}}', '{{if eq .Code 0}}magenta{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'
